# Weekly: generate newsletter (no Tavily, no seen-url skip) and publish HTML to Buttondown.
# Cron is UTC — adjust if you want a specific local Monday.

name: Weekly newsletter

on:
  schedule:
    - cron: "0 14 * * 1" # Monday 14:00 UTC
  workflow_dispatch:
    inputs:
      week_end_date:
        description: "ISO date YYYY-MM-DD (rom-newsletter --date); default last Sunday UTC"
        required: false
        type: string

permissions:
  contents: read

env:
  # Use Node 24 for JS-based actions (avoids Node 20 deprecation warnings on the runner).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set week end date
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.week_end_date }}" ]; then
            W="${{ github.event.inputs.week_end_date }}"
          else
            W=$(date -u -d 'last Sunday' +%F)
          fi
          echo "WEEK_END=$W" >> "$GITHUB_ENV"
          echo "Using WEEK_END=$W"

      - name: Install package
        run: |
          uv venv -p 3.13
          uv pip install --python .venv/bin/python -e .

      - name: Generate newsletter
        env:
          AI_BUILDER_TOKEN: ${{ secrets.AI_BUILDER_TOKEN }}
        run: |
          .venv/bin/rom-newsletter --date "$WEEK_END" --no-skip-seen --output-dir dist --no-tavily

      - name: Publish to Buttondown
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          .venv/bin/rom-newsletter-buttondown --output-dir dist --date "$WEEK_END"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: newsletter-${{ env.WEEK_END }}
          path: dist/
          if-no-files-found: ignore

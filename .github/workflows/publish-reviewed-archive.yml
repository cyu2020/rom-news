name: Publish reviewed issue to archive only

on:
  workflow_dispatch:
    inputs:
      email_id:
        description: "Existing reviewed draft email ID (never a sent issue)"
        required: true
        type: string
      issue_key:
        description: "Exact rom_newsletter_issue metadata value"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rom-newsletter-publication
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev
      - name: Regression checks
        run: uv run --frozen pytest -q
      - name: Import reviewed draft into archive
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          REVIEWED_EMAIL_ID: ${{ inputs.email_id }}
          REVIEWED_ISSUE_KEY: ${{ inputs.issue_key }}
        run: uv run --frozen python -m rom_newsletter.archive_only --email-id "$REVIEWED_EMAIL_ID" --issue-key "$REVIEWED_ISSUE_KEY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: archive-only-confirmation
          path: archive-only-result.json
          if-no-files-found: ignore

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rom-newsletter"
version = "0.1.0"
description = "Weekly newsletter generator for ROM, SciML, and digital twins (arXiv, RSS, newsroom, OpenAI-compatible LLM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
]

[project.scripts]
rom-newsletter = "rom_newsletter.cli:main"
rom-newsletter-buttondown = "rom_newsletter.buttondown_publish:main"

[tool.setuptools.packages.find]
where = ["src"]
